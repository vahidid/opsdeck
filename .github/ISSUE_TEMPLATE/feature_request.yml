name: Feature request
description: An idea for opsdeck
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, in your own words. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working in opsdeck.
  - type: input
    id: area
    attributes:
      label: Area
      placeholder: e.g. agent, VPN, Docker, Kubernetes, Ansible, vault, topology
