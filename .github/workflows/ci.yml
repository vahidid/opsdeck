# Tests: Go (vet and the test suite, which runs its own SSH servers, WireGuard
# peers and scripted models) and the web UI's typecheck.
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "site/**", "**.md"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # real databases for the Databases tests (internal/server/db_test.go)
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: pgpass, POSTGRES_DB: shop }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: rootpass, MYSQL_DATABASE: shop }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -prootpass" --health-interval 5s --health-retries 30
    env:
      OPSDECK_TEST_POSTGRES: app:pgpass@127.0.0.1:5432/shop
      OPSDECK_TEST_MYSQL: root:rootpass@127.0.0.1:3306/shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web UI
        working-directory: web
        run: npm ci && npm run typecheck && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go test ./...
