# Builds opsdeck for Linux, Windows and macOS, and publishes a GitHub release
# for every v* tag (or a version given to Run workflow):
#   desktop app  .deb/.rpm (Linux x86_64), installer and portable .exe
#                (Windows x64), universal .dmg (macOS)
#   CLI          opsdeck-cli-<version>-<os>-<arch>
#   checksums    SHA256SUMS.txt, signed with the release key as
#                SHA256SUMS.txt.minisig (the in-app updater refuses a release
#                without both; docs/releasing.md#signatures)
# The secret OPSDECK_SIGNING_KEY is required to publish. With the optional
# Apple and Windows certificate secrets, the macOS app is signed and notarized
# and the Windows .exe files are Authenticode-signed.
# Other pushes keep the builds as workflow artifacts.
name: Build & release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["docs/**", "site/**", "**.md"]
  # Actions → Build & release → Run workflow, with a version: releases the
  # chosen branch's commit as v<version> (the tag is created by the release)
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (empty: just build)"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: internal/server/dist
          retention-days: 1
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            v="${INPUT_VERSION#v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::not a version: $v"; exit 1; }
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(jq -r .info.productVersion cmd/opsdeck-desktop/wails.json)-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # installers want a plain x.y.z
          echo "number=${v%%[-+]*}" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop · ${{ matrix.name }}
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported Ubuntu, so the binary runs on older glibc too
          - name: Linux
            os: ubuntu-22.04
            platform: linux/amd64
            tags: webkit2_41
          # the Windows build needs no cgo: cross-compiled, installer by makensis
          - name: Windows
            os: ubuntu-latest
            platform: windows/amd64
            tags: ""
          - name: macOS
            os: macos-latest
            platform: darwin/universal
            tags: ""
    env:
      VERSION: ${{ needs.web.outputs.version }}
      NUMBER: ${{ needs.web.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/server/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Linux build dependencies
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)

      - name: Build
        working-directory: cmd/opsdeck-desktop
        shell: bash
        run: |
          jq --arg n "$NUMBER" '.info.productVersion = $n' wails.json > wails.tmp && mv wails.tmp wails.json
          args=(-platform "${{ matrix.platform }}" -skipbindings -trimpath -ldflags "-X main.version=$VERSION")
          [[ -n "${{ matrix.tags }}" ]] && args+=(-tags "${{ matrix.tags }}")
          [[ "${{ matrix.name }}" == Windows ]] && args+=(-nsis)
          wails build "${args[@]}"
          ls -la build/bin

      - name: Package (Linux)
        if: matrix.name == 'Linux'
        working-directory: cmd/opsdeck-desktop
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          mkdir -p dist
          for p in deb rpm; do VERSION="$VERSION" ARCH=amd64 nfpm package -f build/linux/nfpm.yaml -p $p -t dist/; done

      - name: Package (Windows)
        if: matrix.name == 'Windows'
        working-directory: cmd/opsdeck-desktop
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          mkdir -p dist
          mv build/bin/opsdeck-amd64-installer.exe "dist/opsdeck-$VERSION-windows-x64-setup.exe"
          mv build/bin/opsdeck.exe "dist/opsdeck-$VERSION-windows-x64-portable.exe"
          # Authenticode, when a code-signing certificate (.pfx, base64) is set
          if [[ -n "$WINDOWS_CERTIFICATE" ]]; then
            sudo apt-get install -y osslsigncode
            echo "$WINDOWS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.pfx"
            for f in dist/*.exe; do
              osslsigncode sign -pkcs12 "$RUNNER_TEMP/cert.pfx" -pass "$WINDOWS_CERTIFICATE_PASSWORD" \
                -n opsdeck -i https://github.com/${{ github.repository }} -h sha256 \
                -ts http://timestamp.digicert.com -in "$f" -out "$f.signed"
              mv "$f.signed" "$f"
              osslsigncode verify -in "$f" | grep -q "Signature verification: ok"
            done
            rm "$RUNNER_TEMP/cert.pfx"
          else
            echo "::warning::WINDOWS_CERTIFICATE is not set: the .exe files are not Authenticode-signed"
          fi

      - name: Package (macOS)
        if: matrix.name == 'macOS'
        working-directory: cmd/opsdeck-desktop
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg="dist/opsdeck-$VERSION-macos-universal.dmg"
          if [[ -n "$MACOS_CERTIFICATE" ]]; then
            # a Developer ID Application certificate (.p12, base64): sign with
            # the hardened runtime, then notarize and staple the disk image
            kc="$RUNNER_TEMP/build.keychain"
            security create-keychain -p ci "$kc"
            security set-keychain-settings -lut 3600 "$kc"
            security unlock-keychain -p ci "$kc"
            echo "$MACOS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc"
            security list-keychains -d user -s "$kc"
            identity=$(security find-identity -v -p codesigning "$kc" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
            [[ -n "$identity" ]] || { echo "::error::no Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; }
            codesign --force --deep --options runtime --timestamp --sign "$identity" build/bin/opsdeck.app
          else
            # an ad-hoc signature lets it run after "Open" in the Finder's
            # context menu (or System Settings → Privacy & Security)
            echo "::warning::MACOS_CERTIFICATE is not set: the app is not notarized"
            codesign --force --deep --sign - build/bin/opsdeck.app
          fi
          mkdir -p dist dmg
          cp -R build/bin/opsdeck.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname opsdeck -srcfolder dmg -ov -format UDZO "$dmg"
          if [[ -n "$MACOS_CERTIFICATE" ]]; then
            codesign --timestamp --sign "$identity" "$dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$dmg"
            spctl --assess --type open --context context:primary-signature -v "$dmg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: opsdeck-${{ needs.web.outputs.version }}-desktop-${{ matrix.name }}
          path: cmd/opsdeck-desktop/dist/*
          if-no-files-found: error

  cli:
    name: CLI
    needs: web
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.web.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/server/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/opsdeck-cli-$VERSION-$os-$arch$ext" ./cmd/opsdeck
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: opsdeck-${{ needs.web.outputs.version }}-cli
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [web, desktop, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.web.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: opsdeck-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Sign the checksums
        env:
          OPSDECK_SIGNING_KEY: ${{ secrets.OPSDECK_SIGNING_KEY }}
        run: |
          if [[ -z "$OPSDECK_SIGNING_KEY" ]]; then
            echo "::error::the secret OPSDECK_SIGNING_KEY is not set: opsdeck refuses to update to an unsigned release (docs/releasing.md#signatures)"
            exit 1
          fi
          go run ./tools/releasekey sign dist/SHA256SUMS.txt "opsdeck v$VERSION SHA256SUMS.txt"
          go run ./tools/releasekey verify dist/SHA256SUMS.txt
      - name: Release notes
        run: |
          # this version's section of CHANGELOG.md, then how to install
          awk -v v="$VERSION" '
            /^## / { if (f) exit; if (index($0, "[" v "]") || $2 == v) { f = 1; next } }
            f' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Install

          | System | Download |
          |---|---|
          | Windows 10/11 (x64) | \`opsdeck-$VERSION-windows-x64-setup.exe\` (or the portable \`.exe\`) |
          | macOS 12+ (Apple silicon and Intel) | \`opsdeck-$VERSION-macos-universal.dmg\` |
          | Debian / Ubuntu (x86_64) | \`opsdeck_${VERSION}_amd64.deb\` |
          | Fedora / RHEL / openSUSE (x86_64) | \`opsdeck-${VERSION}-1.x86_64.rpm\` |
          | CLI only (\`opsdeck serve\`, opens in the browser) | \`opsdeck-cli-$VERSION-<os>-<arch>\` |

          Or run the install script — see [Install](https://github.com/${{ github.repository }}#install).
          Already installed? opsdeck shows the update in its sidebar and installs it for you.

          \`SHA256SUMS.txt\` is signed with the opsdeck release key. To check a download yourself:

          \`\`\`
          minisign -Vm SHA256SUMS.txt -P $(go run ./tools/releasekey pub)
          sha256sum --check --ignore-missing SHA256SUMS.txt
          \`\`\`
          EOF
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.web.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: opsdeck ${{ needs.web.outputs.version }}
          body_path: notes.md
          files: dist/*
          prerelease: ${{ contains(needs.web.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.web.outputs.version, '-') }}
